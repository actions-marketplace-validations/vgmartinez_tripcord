name: Bug report
description: tripcord crashed, exited with the wrong code, or printed something wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A missed or wrong detection is a false positive or false negative report instead.
        Do not report a security vulnerability here; see SECURITY.md.
  - type: textarea
    id: version
    attributes:
      label: tripcord --version
      description: The full output of `tripcord --version`, or the commit SHA the action or reusable workflow pins.
      render: text
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and architecture, and whether this is the CLI, the action, or a reusable workflow.
      placeholder: linux/amd64, CLI
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The command you ran, or the workflow step with its inputs.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Output and exit code. Remove secrets and private paths.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
